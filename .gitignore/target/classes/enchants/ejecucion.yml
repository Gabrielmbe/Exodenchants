      target: victim
      value-base: 5
      value-scale: 2.5
      true-damage: true
    - type: particle
      target: victim
      value: Dust
      count: 15
    - type: sound
      target: victim
      value: ENTITY_WITHER_HURT
      volume: 0.6
      pitch: 0.8
