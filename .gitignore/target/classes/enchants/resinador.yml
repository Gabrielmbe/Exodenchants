# ============================================================
#  enchants/resinador.yml — Resinador
#  Tier RARO · MECÁNICA NATIVA
# ------------------------------------------------------------
#  Este encantamiento no usa skills de Fabled: su comportamiento
#  manipula bloques, drops, experiencia o durabilidad, algo que
#  ningún sistema de componentes puede expresar. Lo ejecuta el
#  motor de mecánicas propio del plugin, así que funciona
#  siempre que el ítem lo lleve.
# ============================================================

id: resinador
enabled: true

display-name: "Resinador"
tier: raro
max-level: 3
icon: HONEYCOMB

applicable-to:
  - AXE

conflicts: []

lore-line: "<gradient:#7B2CBF:#C77DFF>Resinador {nivel_romano}</gradient>"

description:
  - "<gray>Extrae <white>resina, panal o palos</white> de"
  - "<gray>la madera que talas."
  - "<dark_gray>│ <gray>Probabilidad: <white>25% + 15%</white> <gray>por nivel"

# --- Mecánica nativa: valor = value-base + value-scale x (nivel - 1) ---
mechanic:
  type: sap_harvest
  value-base: 1
  value-scale: 0
  chance-base: 25
  chance-scale: 15

# Sin skill de Fabled: el motor nativo se encarga
fabled-skill: ""
sync-level-with-skill: false
