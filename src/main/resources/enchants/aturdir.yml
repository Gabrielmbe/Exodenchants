id: aturdir
enabled: true

display-name: "Aturdir"
tier: raro
max-level: 3
icon: GOLDEN_HELMET

applicable-to:
  - SWORD
  - MACE

conflicts: []

lore-line: "<gradient:#7B2CBF:#C77DFF>Aturdir {nivel_romano}</gradient>"

