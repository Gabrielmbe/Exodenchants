# ============================================================
#  enchants/zahori.yml — Zahorí
#  Tier LEGENDARIO · MECÁNICA NATIVA
# ------------------------------------------------------------
#  Este encantamiento no usa skills de Fabled: su comportamiento
#  manipula bloques, drops, experiencia o durabilidad, algo que
#  ningún sistema de componentes puede expresar. Lo ejecuta el
#  motor de mecánicas propio del plugin, así que funciona
#  siempre que el ítem lo lleve.
# ============================================================

id: zahori
enabled: true

display-name: "Zahorí"
tier: legendario
max-level: 3
icon: SPYGLASS

applicable-to:
  - PICKAXE

conflicts: []

lore-line: "<gradient:#FFD166:#FFB703>Zahorí {nivel_romano}</gradient>"

description:
  - "<gray>Revela los <white>minerales cercanos</white> con"
  - "<gray>destellos al excavar."
  - "<dark_gray>│ <gray>Probabilidad: <white>25% + 15%</white> <gray>por nivel"
  - "<dark_gray>│ <gray>Radio: <white>5 + 2</white> <gray>por nivel"

# --- Mecánica nativa: valor = value-base + value-scale x (nivel - 1) ---
mechanic:
  type: ore_reveal
  value-base: 1
  value-scale: 0
  chance-base: 25
  chance-scale: 15

# Sin skill de Fabled: el motor nativo se encarga
fabled-skill: ""
sync-level-with-skill: false
