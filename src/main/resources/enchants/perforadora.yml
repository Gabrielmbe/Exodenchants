# ============================================================
#  enchants/perforadora.yml — Perforadora
#  Tier MITICO · MECÁNICA NATIVA
# ------------------------------------------------------------
#  Este encantamiento no usa skills de Fabled: su comportamiento
#  manipula bloques, drops, experiencia o durabilidad, algo que
#  ningún sistema de componentes puede expresar. Lo ejecuta el
#  motor de mecánicas propio del plugin, así que funciona
#  siempre que el ítem lo lleve.
# ============================================================

id: perforadora
enabled: true

display-name: "Perforadora"
tier: mitico
max-level: 2
icon: NETHERITE_PICKAXE

applicable-to:
  - PICKAXE

conflicts: []

lore-line: "<gradient:#F72585:#B5179E>Perforadora {nivel_romano}</gradient>"

description:
  - "<gray>Rompe un área <white>3x3</white> en la cara"
  - "<gray>que estés mirando."
  - "<dark_gray>│ <gray>Túneles instantáneos"

# --- Mecánica nativa: valor = value-base + value-scale x (nivel - 1) ---
mechanic:
  type: area_break
  value-base: 1
  value-scale: 0
  chance-base: 100
  chance-scale: 0

# Sin skill de Fabled: el motor nativo se encarga
fabled-skill: ""
sync-level-with-skill: false
