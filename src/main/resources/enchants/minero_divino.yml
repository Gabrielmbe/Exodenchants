#  Tier DIVINO · nivel máximo 5
# ============================================================

id: minero_divino
enabled: true

display-name: "Minero Divino"
tier: divino
max-level: 5
icon: BEACON

applicable-to:
  - PICKAXE

conflicts: []

lore-line: "<gradient:#00F5D4:#4CC9F0>Minero Divino {nivel_romano}</gradient>"

description:
  - "<gray>Excavas a velocidad sobrehumana"
  - "<gray>y ves en la oscuridad total."
  - "<dark_gray>│ <gray>Probabilidad: <white>30% + 10%</white> <gray>por nivel"
  - "<dark_gray>│ <gray>Duración: <white>10s + 2s</white> <gray>por nivel"

fabled-skill: "FE_MineroDivino"
sync-level-with-skill: true

# --- Efecto nativo (motor propio: no depende de Fabled) ---
effects:
  trigger: mine
  chance-base: 30
  chance-scale: 10
  actions:
    - type: potion
      target: self
      value: Haste
      amplifier: 3
      seconds-base: 10
      seconds-scale: 2
    - type: potion
      target: self
      value: NightVision
      amplifier: 0
      seconds-base: 12
      seconds-scale: 3
    - type: sound
      target: self
      value: BLOCK_BEACON_POWER_SELECT
      volume: 0.4
      pitch: 1.6
