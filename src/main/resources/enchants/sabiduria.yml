# ============================================================
#  enchants/sabiduria.yml — Sabiduría
#  Tier RARO · MECÁNICA NATIVA
# ------------------------------------------------------------
#  Este encantamiento no usa skills de Fabled: su comportamiento
#  manipula bloques, drops, experiencia o durabilidad, algo que
#  ningún sistema de componentes puede expresar. Lo ejecuta el
#  motor de mecánicas propio del plugin, así que funciona
#  siempre que el ítem lo lleve.
# ============================================================

id: sabiduria
enabled: true

display-name: "Sabiduría"
tier: raro
max-level: 3
icon: EXPERIENCE_BOTTLE

applicable-to:
  - PICKAXE

conflicts: []

lore-line: "<gradient:#7B2CBF:#C77DFF>Sabiduría {nivel_romano}</gradient>"

description:
  - "<gray>Multiplica la <white>experiencia</white> que"
  - "<gray>sueltan los bloques al excavar."
  - "<dark_gray>│ <gray>Multiplicador: <white>x2 + x1</white> <gray>por nivel"

# --- Mecánica nativa: valor = value-base + value-scale x (nivel - 1) ---
mechanic:
  type: xp_boost
  value-base: 2
  value-scale: 1
  chance-base: 100
  chance-scale: 0

# Sin skill de Fabled: el motor nativo se encarga
fabled-skill: ""
sync-level-with-skill: false
