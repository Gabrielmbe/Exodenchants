# ============================================================
#  FabledCustomEnchants — books/libro_encantamiento.yml
#  Plantilla del Libro de Encantamiento
# ------------------------------------------------------------
#  Placeholders internos resueltos al generar el libro:
#    {id}            → id del encantamiento (vampirismo, zeus...)
#    {enchant}       → nombre visible del encantamiento
#    {nivel}         → nivel numérico (1, 2, 3)
#    {nivel_romano}  → nivel en romano (I, II, III)
#    {exito}         → % de éxito sorteado en pools/tiers.yml
#    {ruptura}       → % de ruptura sorteado en pools/tiers.yml
#    {tier}          → display del tier (MiniMessage)
#    {tier_id}       → id del tier (comun | raro | legendario)
#    {tier_color}    → color hex del tier
#    {aplicable}     → ítems donde puede usarse (applicable-to del
#                      encanto, con los nombres de group-names)
# ============================================================

material: ENCHANTED_BOOK
glint: "{tier_glint}"          # Tomado de pools/tiers.yml → book-glint
stack-size: 1

display-name: "<dark_gray>» <color:{tier_color}>{enchant} {nivel_romano}</color> <dark_gray>«"

# Lore estético (los datos reales viven en Data Components, no aquí)
lore:
  - ""
  - "<dark_gray>│ <gray>Tier <dark_gray>· {tier}"
  - "<dark_gray>│ <gray>Nivel <dark_gray>· <white>{nivel_romano}"
  - "<dark_gray>│ <gray>Aplicable <dark_gray>· <white>{aplicable}"
  - ""
  - "<dark_gray>│ <green>✔ Éxito <dark_gray>· <white>{exito}%"
  - "<dark_gray>│ <red>✖ Ruptura <dark_gray>· <white>{ruptura}%"
  - ""
  - "<dark_purple>Arrastra este libro sobre un ítem"
  - "<dark_purple>compatible y haz click para aplicar."

# ------------------------------------------------------------
# RACHA DE SUERTE VISIBLE
# Bloque añadido al final del lore cuando el jugador que sostiene
# el libro con el cursor lleva fallos acumulados en el tier del
# libro (sistema de pity de config.yml → luck). Se actualiza al
# tomar el libro y desaparece solo cuando la racha se reinicia.
#
# Placeholders adicionales (solo válidos en esta sección):
#   {racha}            → fallos consecutivos en este tier
#   {bono}             → bono de suerte actual (+%)
#   {exito_efectivo}   → éxito real: {exito} + {bono}, tope 100
#   {siguiente_bono}   → bono si el próximo intento también falla
# ------------------------------------------------------------
luck-lore:
  - ""
  - "<dark_gray>│ <gold>☘ Racha <dark_gray>· <white>{racha} <gray>fallos seguidos"
  - "<dark_gray>│ <gold>☘ Bono de suerte <dark_gray>· <green>+{bono}%</green> <dark_gray>(<gray>éxito real <white>{exito_efectivo}%</white><dark_gray>)"
  - "<dark_gray>│ <yellow>Un fallo más <dark_gray>→ <gold>+{siguiente_bono}%"

# ------------------------------------------------------------
# Nombres visibles de los grupos de applicable-to ({aplicable}).
# Las claves deben coincidir con los grupos de
# modules/drag_and_drop.yml → item-groups.
# Si un grupo no aparece aquí, se usa un nombre por defecto.
# ------------------------------------------------------------
group-names:
  PICKAXE: "Picos"
  AXE: "Hachas"
  SHOVEL: "Palas"
  HOE: "Azadas"
  SWORD: "Espadas"
  BOW: "Arcos"
  CROSSBOW: "Ballestas"
  TRIDENT: "Tridentes"
  HELMET: "Cascos"
  CHESTPLATE: "Pecheras"
  LEGGINGS: "Pantalones"
  BOOTS: "Botas"
  ARMOR: "Armadura"
  TOOLS: "Herramientas"
  WEAPONS: "Armas"
  ELYTRA: "Élitros"
  SHIELD: "Escudos"

# ------------------------------------------------------------
# DATA COMPONENTS (minecraft:custom_data → PersistentDataContainer)
# Claves definidas en config.yml → storage.keys
# Es la ÚNICA fuente de verdad que lee el módulo drag_and_drop.
# ------------------------------------------------------------
data-components:
  fe_id: "{id}"              # STRING
  fe_level: "{nivel}"        # INTEGER
  fe_success: "{exito}"      # INTEGER (1-100)
  fe_destroy: "{ruptura}"    # INTEGER (0-100)
  fe_tier: "{tier_id}"       # STRING

# Oculta los tooltips vanilla que ensucian la estética
hide-flags:
  - HIDE_ENCHANTS
  - HIDE_ADDITIONAL_TOOLTIP
