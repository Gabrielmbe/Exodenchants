name: ExodeEnchant
main: dev.fce.FabledCustomEnchantsPlugin
version: 1.0.0
api-version: '1.21'
description: Sistema de encantamientos personalizados sobre Fabled 5.
softdepend: [Fabled, Vault, PlaceholderAPI]
commands:
  encantos:
    description: Abre el menu de encantamientos.
    aliases: [fce]
    usage: /encantos [catalogo | categorias | polvos | mercado | top | combos | fusion | reciclar | inspect | check | debug | reload | trader <spawn|remove|refresh> | give <enchant> <nivel> [exito] [ruptura] | dust <polvo> [cantidad]]
permissions:
  fce.admin:
    description: Acceso a los subcomandos administrativos.
    default: op
